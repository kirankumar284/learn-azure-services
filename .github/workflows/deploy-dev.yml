name: Build and Deploy .NET Core App to Azure App Service (Dev Environment)

# Trigger whenever you push to the development branch
on:
  push:
    branches:
      - development
  workflow_dispatch:

# Environment variables
env:
  AZURE_WEBAPP_NAME: 'etrm-web-app-dev'
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Step 2.1: Restore NuGet dependencies
      - name: Restore dependencies
        run: dotnet restore ./trade-api/trade-api.csproj

      # Step 2.2: Install EF Core CLI
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      # Step 2.3: Apply database migrations
      - name: Apply Database Migrations
        run: |
          dotnet ef database update \
            --project ./trade-api/trade-api.csproj \
            --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING_DEV }}"

      # Step 3: Build and publish the application
      - name: Build and Publish .NET app
        run: dotnet publish ./trade-api/trade-api.csproj -c Release -o ./publish_output

      # Step 4: Deploy to Azure App Service
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          package: ./publish_output
