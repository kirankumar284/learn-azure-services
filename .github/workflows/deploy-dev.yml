name: Build and Deploy .NET Core App to Azure App Service (Dev Environment)

# 1. This triggers the workflow whenever you push to the 'development' branch
on:
  push:
    branches:
      - development
  workflow_dispatch: # Allows you to run the build manually from the UI

# 2. Set environment variables
env:
  AZURE_WEBAPP_NAME: 'etrm-web-app-dev'   # CHANGE THIS to your App Service name
  DOTNET_VERSION: '10.0.x'                 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code from your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the .NET environment on the build server
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Step 3: Build the application and package it for Release
      - name: Build and Publish .NET app
        run: dotnet publish ./trade-api/trade-api.csproj -c Release -o ./publish_output

      # Step 4: Deploy the packaged app to Azure
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          package: ./publish_output
